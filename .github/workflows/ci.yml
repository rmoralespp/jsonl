
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # pip>=25.1 (needed for `--group`) is not available on Python 3.8, so use uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: uv pip install --system --group=test

      - name: Run tests
        run: python -m pytest tests/

  quality:
    name: Code quality and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install tests/lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group=test --group=lint --upgrade

      - name: Run Ruff linter
        run: ruff check --quiet --output-format=concise

      - name: Run sphinx-linter
        run: spxl . --enable=ALL

      - name: Run pymport
        run: pymport .

      - name: Run tests and collect coverage
        run: python -m pytest tests/ --cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rmoralespp/jsonl
